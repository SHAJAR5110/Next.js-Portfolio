<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="pythonCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#pythonCode)"/>

  <!-- Window header -->
  <rect width="400" height="30" fill="#0f3460"/>
  <circle cx="15" cy="15" r="4" fill="#ff5e5b"/>
  <circle cx="30" cy="15" r="4" fill="#ffbd2e"/>
  <circle cx="45" cy="15" r="4" fill="#26c281"/>
  <text x="200" y="20" font-size="12" fill="#ffd60a" text-anchor="middle" font-family="monospace">main.py</text>

  <!-- Code content -->
  <text x="15" y="55" font-size="11" fill="#ff79c6" font-family="monospace">import requests</text>
  <text x="15" y="70" font-size="11" fill="#ff79c6" font-family="monospace">from flask import Flask</text>
  <text x="15" y="85" font-size="11" fill="#ff79c6" font-family="monospace">app = Flask(</text>
  <text x="140" y="85" font-size="10" fill="#f7dc6f" font-family="monospace">__name__</text>
  <text x="210" y="85" font-size="11" fill="#ff79c6" font-family="monospace">)</text>
  <text x="15" y="105" font-size="11" fill="#ff79c6" font-family="monospace">@app.route(</text>
  <text x="140" y="105" font-size="10" fill="#f7dc6f" font-family="monospace">'/api'</text>
  <text x="210" y="105" font-size="11" fill="#ff79c6" font-family="monospace">)</text>
  <text x="15" y="125" font-size="11" fill="#8be9fd" font-family="monospace">def api():</text>
  <text x="30" y="145" font-size="11" fill="#8be9fd" font-family="monospace">return {</text>
  <text x="50" y="160" font-size="10" fill="#f7dc6f" font-family="monospace">'status'</text>
  <text x="120" y="160" font-size="10" fill="#f7dc6f" font-family="monospace">200</text>
  <text x="30" y="175" font-size="11" fill="#8be9fd" font-family="monospace">}</text>

  <!-- Syntax highlighting bar at bottom -->
  <rect y="215" width="400" height="35" fill="#0f3460"/>
  <circle cx="20" cy="232" r="3" fill="#ffd60a"/>
  <text x="28" y="237" font-size="11" fill="#ffd60a" font-family="monospace">Python • Flask • API</text>
</svg>
