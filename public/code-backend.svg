<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="backendCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#backendCode)"/>

  <!-- Window header -->
  <rect width="400" height="30" fill="#0f3460"/>
  <circle cx="15" cy="15" r="4" fill="#ff5e5b"/>
  <circle cx="30" cy="15" r="4" fill="#ffbd2e"/>
  <circle cx="45" cy="15" r="4" fill="#26c281"/>
  <text x="200" y="20" font-size="12" fill="#ff6b6b" text-anchor="middle" font-family="monospace">server.cs</text>

  <!-- Code content -->
  <text x="15" y="55" font-size="11" fill="#ff79c6" font-family="monospace">[HttpGet(</text>
  <text x="120" y="55" font-size="10" fill="#f7dc6f" font-family="monospace">"api/users"</text>
  <text x="230" y="55" font-size="11" fill="#ff79c6" font-family="monospace">)]</text>
  <text x="15" y="70" font-size="11" fill="#8be9fd" font-family="monospace">public async Task</text>
  <text x="200" y="70" font-size="11" fill="#8be9fd" font-family="monospace">GetUsers()</text>
  <text x="15" y="85" font-size="11" fill="#ff79c6" font-family="monospace">{</text>
  <text x="30" y="105" font-size="10" fill="#8be9fd" font-family="monospace">var users =</text>
  <text x="150" y="105" font-size="10" fill="#8be9fd" font-family="monospace">await _db</text>
  <text x="30" y="125" font-size="10" fill="#8be9fd" font-family="monospace">.Users.ToListAsync()</text>
  <text x="30" y="145" font-size="10" fill="#8be9fd" font-family="monospace">return Ok(users)</text>
  <text x="15" y="165" font-size="11" fill="#ff79c6" font-family="monospace">}</text>
  <text x="15" y="185" font-size="10" fill="#50fa7b" font-family="monospace">// Status: 200 OK</text>

  <!-- Syntax highlighting bar at bottom -->
  <rect y="215" width="400" height="35" fill="#0f3460"/>
  <circle cx="20" cy="232" r="3" fill="#ff6b6b"/>
  <text x="28" y="237" font-size="11" fill="#ff6b6b" font-family="monospace">ASP.NET • C# • REST API</text>
</svg>
