<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Background -->
  <rect width="256" height="256" fill="#0d1117" rx="12"/>

  <!-- GitHub Logo -->
  <g transform="translate(128, 128)">
    <!-- Circle background -->
    <circle cx="0" cy="0" r="90" fill="#1f6feb" opacity="0.1" stroke="#1f6feb" stroke-width="2"/>

    <!-- GitHub Octocat simplified -->
    <path d="M -30 -20 C -40 -25 -50 -15 -50 0 L -50 30 C -50 45 -40 55 -25 55 L 25 55 C 40 55 50 45 50 30 L 50 0 C 50 -15 40 -25 30 -20 M -20 55 L -20 70 M 0 55 L 0 70 M 20 55 L 20 70 M -35 10 C -40 10 -45 15 -45 20 C -45 25 -40 30 -35 30 C -30 30 -25 25 -25 20 C -25 15 -30 10 -35 10 M 35 10 C 30 10 25 15 25 20 C 25 25 30 30 35 30 C 40 30 45 25 45 20 C 45 15 40 10 35 10 M -15 25 C -18 25 -20 28 -20 31 C -20 34 -18 37 -15 37 C -12 37 -10 34 -10 31 C -10 28 -12 25 -15 25 M 15 25 C 12 25 10 28 10 31 C 10 34 12 37 15 37 C 18 37 20 34 20 31 C 20 28 18 25 15 25" fill="#1f6feb"/>

    <!-- Fork icon (simplified) -->
    <g transform="translate(-70, -70)">
      <circle cx="0" cy="0" r="6" fill="#58a6ff"/>
      <line x1="0" y1="6" x2="0" y2="15" stroke="#58a6ff" stroke-width="1.5"/>
      <circle cx="-8" cy="20" r="4" fill="#58a6ff"/>
      <circle cx="8" cy="20" r="4" fill="#58a6ff"/>
      <line x1="-8" y1="16" x2="0" y2="15" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="8" cy="16" x2="0" y2="15" stroke="#58a6ff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Text label -->
  <text x="128" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#58a6ff" font-weight="bold">GitHub Repository</text>
</svg>
