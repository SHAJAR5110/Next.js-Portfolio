<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="webCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#webCode)"/>

  <!-- Window header -->
  <rect width="400" height="30" fill="#0f3460"/>
  <circle cx="15" cy="15" r="4" fill="#ff5e5b"/>
  <circle cx="30" cy="15" r="4" fill="#ffbd2e"/>
  <circle cx="45" cy="15" r="4" fill="#26c281"/>
  <text x="200" y="20" font-size="12" fill="#00d4ff" text-anchor="middle" font-family="monospace">index.jsx</text>

  <!-- Code content -->
  <text x="15" y="55" font-size="11" fill="#7ec699" font-family="monospace">function App() {</text>
  <text x="25" y="70" font-size="11" fill="#7ec699" font-family="monospace">return (</text>
  <text x="35" y="85" font-size="10" fill="#61dafb" font-family="monospace">&lt;div className=</text>
  <text x="190" y="85" font-size="10" fill="#f7dc6f" font-family="monospace">"container"</text>
  <text x="35" y="100" font-size="10" fill="#61dafb" font-family="monospace">&lt;h1&gt;</text>
  <text x="85" y="100" font-size="10" fill="#e0e0e0" font-family="monospace">Hello World</text>
  <text x="175" y="100" font-size="10" fill="#61dafb" font-family="monospace">&lt;/h1&gt;</text>
  <text x="35" y="115" font-size="10" fill="#61dafb" font-family="monospace">&lt;/div&gt;</text>
  <text x="25" y="130" font-size="11" fill="#7ec699" font-family="monospace">)</text>
  <text x="15" y="145" font-size="11" fill="#7ec699" font-family="monospace">}</text>

  <!-- Syntax highlighting bar at bottom -->
  <rect y="215" width="400" height="35" fill="#0f3460"/>
  <circle cx="20" cy="232" r="3" fill="#61dafb"/>
  <text x="28" y="237" font-size="11" fill="#00d4ff" font-family="monospace">React • JavaScript • Web</text>
</svg>
