<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="npmCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#npmCode)"/>

  <!-- Terminal header -->
  <rect width="400" height="30" fill="#0f3460"/>
  <circle cx="15" cy="15" r="4" fill="#ff5e5b"/>
  <circle cx="30" cy="15" r="4" fill="#ffbd2e"/>
  <circle cx="45" cy="15" r="4" fill="#26c281"/>
  <text x="200" y="20" font-size="12" fill="#cb3837" text-anchor="middle" font-family="monospace">terminal</text>

  <!-- Terminal content -->
  <text x="15" y="55" font-size="11" fill="#50fa7b" font-family="monospace">$ npm install cmd-calculator</text>
  <text x="15" y="70" font-size="10" fill="#e0e0e0" font-family="monospace">added 45 packages in 3.5s</text>

  <text x="15" y="90" font-size="11" fill="#50fa7b" font-family="monospace">$ npx cmd-calculator</text>
  <text x="15" y="110" font-size="10" fill="#e0e0e0" font-family="monospace">&gt; Welcome to Calculator!</text>
  <text x="15" y="130" font-size="10" fill="#e0e0e0" font-family="monospace">&gt; Enter operation: 5 + 3</text>
  <text x="15" y="150" font-size="10" fill="#f7dc6f" font-family="monospace">Result: 8</text>
  <text x="15" y="170" font-size="11" fill="#50fa7b" font-family="monospace">$</text>

  <!-- Syntax highlighting bar at bottom -->
  <rect y="215" width="400" height="35" fill="#0f3460"/>
  <circle cx="20" cy="232" r="3" fill="#cb3837"/>
  <text x="28" y="237" font-size="11" fill="#cb3837" font-family="monospace">NPM • CLI • Node Package</text>
</svg>
